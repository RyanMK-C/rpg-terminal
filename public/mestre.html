<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Mestre — RPG Terminal</title>
  <link rel="icon" href="data:,">
  <style>
    body {
      background-color: black;
      color: #00ff88;
      font-family: "Courier New", monospace;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      text-align: center;
      font-size: 1.3rem;
      padding: 10px;
      border-bottom: 2px solid #00ff88;
      text-shadow: 0 0 8px #00ff88;
    }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      font-size: 1rem;
      white-space: pre-wrap;
      border-bottom: 2px solid #00ff88;
    }

   #controls {
  padding: 15px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  background: #001a12;
  align-items: center;
  justify-content: flex-start;
  flex-shrink: 0;
}
#audiofile, #sendAudio {
  flex-basis: 100%;
}
    input, button, select {
      background: black;
      color: #00ff88;
      border: 1px solid #00ff88;
      font-family: "Courier New", monospace;
      padding: 5px 8px;
      border-radius: 4px;
    }

    button:hover {
      background: #003322;
      cursor: pointer;
    }

    .glitch {
      animation: glitch 1s infinite;
    }

    @keyframes glitch {
      0% { text-shadow: 2px 0 #00ff88; }
      20% { text-shadow: -2px 0 #00ff88; }
      40% { text-shadow: 2px 2px #00ff88; }
      60% { text-shadow: -2px -2px #00ff88; }
      100% { text-shadow: 2px 0 #00ff88; }
    }
  </style>
</head>
<body>
  <header class="glitch">⚡ PAINEL DO MESTRE ⚡</header>

  <div id="log"></div>

  <div id="controls">
    <input id="msg" type="text" placeholder="Digite uma mensagem ou comando..." style="flex:1;">
    <button id="send">Enviar</button>
    <select id="effect">
      <option value="">Efeito...</option>
      <option value="glitch">Glitch</option>
      <option value="alerta">Alerta</option>
      <option value="limpar">Limpar Tela</option>
    </select>
    <button id="applyEffect">Aplicar</button>
    <!-- Enviar áudio -->
<h3>Enviar Áudio</h3>
<input id="audiofile" type="file" accept=".mp3">
<button id="sendAudio">Tocar para Jogadores</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="mestre.js"></script>
</body>
</html>
