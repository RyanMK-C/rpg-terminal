<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel do Mestre</title>
  <style>
    body {
      background: black;
      color: lime;
      font-family: monospace;
      padding: 10px;
    }
    #controls {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    input, select, button {
      background: black;
      color: lime;
      border: 1px solid lime;
      padding: 5px;
      font-family: monospace;
    }
    #log {
      border: 1px solid lime;
      padding: 10px;
      height: 70vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h2>Painel do Mestre</h2>

  <div id="controls">
    <input id="msg" type="text" placeholder="Mensagem ou comando..." style="flex:1;">
    <button id="send">Enviar</button>
    <select id="effect">
      <option value="">Efeito...</option>
      <option value="glitch">Glitch</option>
      <option value="alerta">Alerta</option>
      <option value="limpar">Limpar Tela</option>
    </select>
    <button id="applyEffect">Aplicar</button>

    <!-- 🔊 Upload de áudio -->
    <input type="file" id="audioFile" accept="audio/*">
    <button id="sendAudio">Enviar Áudio</button>
  </div>

  <div id="log"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="mestre.js"></script>
</body>
</html>
