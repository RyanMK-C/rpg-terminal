<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Terminal RPG</title>
  <style>
    body {
      background: black;
      color: lime;
      font-family: monospace;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #tela {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    #entrada {
      border: none;
      outline: none;
      background: black;
      color: lime;
      font-family: monospace;
      font-size: 1rem;
      padding: 8px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="tela"></div>
  <input id="entrada" placeholder="Digite aqui..." autocomplete="off" />

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
