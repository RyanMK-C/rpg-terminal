<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Terminal RPG</title>
  <style>
    body {
      background: black;
      color: lime;
      font-family: monospace;
      margin: 0;
      padding: 0;
    }
    #login, #terminal, #mestre {
      display: none;
      height: 100vh;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #login { display: flex; }
    input, textarea, select, button {
      background: black;
      color: lime;
      border: 1px solid lime;
      outline: none;
      font-family: monospace;
      font-size: 1rem;
      padding: 6px;
      margin-top: 5px;
    }
    textarea { width: 90%; height: 80px; resize: none; }
    button:hover { background: lime; color: black; cursor: pointer; }
    #tela {
      width: 100%;
      height: 80vh;
      overflow-y: auto;
      padding: 10px;
    }
    .box {
      border: 1px solid lime;
      padding: 20px;
      width: 300px;
    }
    .log {
      font-size: 0.8em;
      color: gray;
      margin-top: 10px;
      text-align: left;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <!-- Login -->
  <div id="login">
    <div class="box">
      <h2>Terminal RPG</h2>
      <input id="senha" type="password" placeholder="Insira a senha..." />
      <button id="entrar">Entrar</button>
    </div>
  </div>

  <!-- Terminal do jogador -->
  <div id="terminal">
    <div id="tela"></div>
    <input id="entrada" placeholder="Digite sua mensagem..." />
  </div>

  <!-- Painel do Mestre -->
  <div id="mestre">
    <div class="box">
      <h2>Painel do Mestre</h2>
      <textarea id="msg" placeholder="Mensagem para enviar..."></textarea><br>
      <button id="enviar">Enviar Mensagem</button>
      <h3>Efeitos</h3>
      <select id="efeito">
        <option value="alerta">Alerta Vermelho</option>
        <option value="limpar">Limpar Tela</option>
      </select>
      <button id="aplicar">Aplicar Efeito</button>

      <h3>Enviar Áudio (MP3)</h3>
      <input id="audiofile" type="file" accept=".mp3" />
      <button id="enviarAudio">Tocar nos jogadores</button>

      <div class="log" id="log"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io("https://omega-terminal.onrender.com", {
      transports: ["websocket", "polling"],
      secure: true,
      reconnection: true,
      reconnectionAttempts: 5,
      reconnectionDelay: 2000
    });

    const login = document.getElementById("login");
    const terminal = document.getElementById("terminal");
    const mestre = document.getElementById("mestre");
    const senhaInput = document.getElementById("senha");
    const entrarBtn = document.getElementById("entrar");

    let tipoUsuario = "jogador"; // padrão

    entrarBtn.addEventListener("click", () => {
      const senha = senhaInput.value.trim();
      if (senha === "Ozymandias") {
        tipoUsuario = "mestre";
        login.style.display = "none";
        mestre.style.display = "flex";
      } else {
        tipoUsuario = "jogador";
        login.style.display = "none";
        terminal.style.display = "flex";
      }
    });

    // === Terminal jogador ===
    const tela = document.getElementById("tela");
    const entrada = document.getElementById("entrada");

    entrada?.addEventListener("keydown", e => {
      if (e.key === "Enter" && entrada.value.trim() !== "") {
        socket.emit("mensagem", { autor: tipoUsuario, texto: entrada.value });
        entrada.value = "";
      }
    });

    socket.on("mensagem", ({ autor, texto }) => {
      const line = document.createElement("div");
      if (autor === "mestre") line.textContent = `???: ${texto}`;
      else line.textContent = `Usuário: ${texto}`;
      tela.appendChild(line);
      tela.scrollTop = tela.scrollHeight;
    });

    socket.on("efeito", efeito => {
      if (efeito === "alerta") {
        document.body.style.backgroundColor = "#400000";
        setTimeout(() => document.body.style.backgroundColor = "black", 1000);
      } else if (efeito === "limpar") {
        tela.innerHTML = "";
      }
    });

    // === Painel do mestre ===
    const msg = document.getElementById("msg");
    const enviar = document.getElementById("enviar");
    const efeito = document.getElementById("efeito");
    const aplicar = document.getElementById("aplicar");
    const log = document.getElementById("log");

    enviar?.addEventListener("click", () => {
      socket.emit("mensagem", { autor: "mestre", texto: msg.value });
      addLog("Mensagem enviada.");
      msg.value = "";
    });

    aplicar?.addEventListener("click", () => {
      socket.emit("efeito", efeito.value);
      addLog("Efeito aplicado: " + efeito.value);
    });

    function addLog(txt) {
      const line = document.createElement("div");
      line.textContent = txt;
      log.appendChild(line);
      log.scrollTop = log.scrollHeight;
    }

    // === Upload de áudio ===
    const audioInput = document.getElementById("audiofile");
    const enviarAudioBtn = document.getElementById("enviarAudio");

    enviarAudioBtn?.addEventListener("click", async () => {
      if (!audioInput.files.length) {
        alert("Selecione um arquivo MP3 primeiro.");
        return;
      }
      const file = audioInput.files[0];
      const formData = new FormData();
      formData.append("audio", file);

      addLog("⏳ Enviando áudio...");

      try {
        const res = await fetch("/upload", { method: "POST", body: formData });
        if (!res.ok) throw new Error("Falha no upload");
        const data = await res.json();
        addLog(`🎵 Áudio enviado: ${data.file}`);
      } catch (err) {
        addLog("❌ Erro ao enviar o áudio.");
      }
    });

    // === Jogadores recebem o áudio ===
    socket.on("play-audio", fileName => {
      if (tipoUsuario === "jogador") {
        const audio = new Audio(`/uploads/${fileName}`);
        audio.play().catch(() => {});
      }
    });
  </script>
</body>
</html>
