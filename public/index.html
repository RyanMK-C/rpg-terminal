<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Terminal RPG</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      --bg: #000;
      --fg: #9fff6f;
      --muted: #6b8f5b;
      --accent: #00ff88;
    }
    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family: "Courier New", Courier, monospace;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Layout containers */
    #login, #terminal {
      box-sizing: border-box;
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:12px;
      padding:20px;
    }
    #login { display:flex; }
    #terminal { display:none; padding:18px; align-items:flex-start; }

    /* Login UI */
    .card {
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(0,255,136,0.06);
      padding:18px;
      width: min(760px, 95%);
      text-align:center;
      border-radius:6px;
    }
    .card p { margin: 6px 0 12px 0; color: var(--muted); }

    input[type="password"], input[type="text"] {
      background: black;
      color: var(--fg);
      border: 1px solid rgba(0,255,136,0.15);
      outline: none;
      padding:10px 12px;
      width: 100%;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 1rem;
      border-radius:4px;
    }

    /* Terminal */
    #terminalWrap {
      width: min(1000px, 98%);
      height: 86vh;
      border: 1px solid rgba(0,255,136,0.06);
      background: linear-gradient(180deg, rgba(0,0,0,0.92), rgba(0,0,0,0.98));
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
      box-sizing:border-box;
      border-radius:6px;
    }
    #tela {
      flex:1;
      width:100%;
      overflow:auto;
      white-space:pre-wrap;
      line-height:1.3;
      font-size: 16px;
    }
    #controls {
      display:flex;
      gap:8px;
      align-items:center;
    }
    #entrada {
      flex:1;
    }
    .hint { color: var(--muted); font-size:0.9rem; }

    /* Glitch overlay */
    #glitch {
      display:none;
      position:fixed;
      inset:0;
      z-index:9999;
      color:var(--accent);
      font-family:monospace;
      pointer-events:none;
      background:rgba(0,0,0,0.0);
      mix-blend-mode: screen;
      text-align:center;
      padding-top:18vh;
      font-size:2.6rem;
      letter-spacing:4px;
      opacity:0.85;
      animation:glitch 0.28s infinite;
    }
    @keyframes glitch {
      0%{text-shadow:2px 0 var(--accent);}
      50%{text-shadow:-2px 0 #33ff88;}
      100%{text-shadow:2px 0 var(--accent);}
    }

    /* small screens */
    @media (max-width:560px){
      #glitch{font-size:1.6rem;padding-top:12vh}
      #terminalWrap{height:80vh}
      #tela{font-size:14px}
    }
  </style>
</head>
<body>
  <div id="glitch">▒▒▒▒▒ GLITCH MODE ▒▒▒▒▒</div>

  <div id="login">
    <div class="card">
      <h2 style="margin:0;color:var(--fg)">Terminal RPG — Acesso</h2>
      <p>Digite a senha do Mestre para entrar no terminal</p>
      <input id="senha" type="password" placeholder="Senha (ex: Ozymandias)" autocomplete="off" />
      <p class="hint">Pressione Enter para confirmar. Senha correta: <em>Ozymandias</em></p>
    </div>
  </div>

  <div id="terminal">
    <div id="terminalWrap">
      <div id="tela" aria-live="polite"></div>
      <div id="controls">
        <input id="entrada" type="text" placeholder="Digite comando e pressione Enter..." autocomplete="off" />
        <div style="width:120px;text-align:right;color:var(--muted);font-size:0.9rem">Status: <span id="status">desconectado</span></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
