<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Terminal RPG</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body {
      background: #000;
      color: #00ff88;
      font-family: monospace;
      margin: 0;
      padding: 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #login, #terminal, #painel {
      display: none;
      width: 100%;
      max-width: 800px;
    }
    #login {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    input, textarea, select, button {
      background: #111;
      color: #9fff6f;
      border: 1px solid #00ff88;
      font-family: monospace;
      padding: 8px;
      border-radius: 4px;
    }
    #tela {
      background: #010;
      padding: 10px;
      height: 60vh;
      overflow-y: auto;
      white-space: pre-wrap;
      border-radius: 4px;
    }
    #entrada {
      width: 100%;
      margin-top: 10px;
    }
    #painel .box {
      background: #050;
      padding: 20px;
      border-radius: 8px;
    }
    #painel .log {
      background: #020;
      padding: 10px;
      height: 200px;
      overflow-y: auto;
      margin-top: 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <!-- Login -->
  <div id="login">
    <h2>Autenticação</h2>
    <input id="senha" type="password" placeholder="Digite a senha..." />
    <button id="entrar">Entrar</button>
    <small>Jogador: Ozymandias | Mestre: Mestre</small>
  </div>

  <!-- Terminal Jogador -->
  <div id="terminal">
    <div id="tela"></div>
    <input id="entrada" type="text" placeholder="Digite sua mensagem..." />
  </div>

  <!-- Painel Mestre -->
  <div id="painel">
    <div class="box">
      <h2>Painel do Mestre</h2>
      <textarea id="msg" placeholder="Mensagem para enviar..."></textarea><br>
      <button id="enviar">Enviar Mensagem</button>
      <h3>Efeitos</h3>
      <select id="efeito">
        <option value="alerta">Alerta Vermelho</option>
        <option value="limpar">Limpar tela</option>
      </select>
      <button id="aplicar">Aplicar Efeito</button>
      <div class="log" id="log"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io("https://omega-terminal.onrender.com", {
    transports: ["websocket", "polling"]
  });

  const login = document.getElementById("login");
  const terminal = document.getElementById("terminal");
  const painel = document.getElementById("painel");
  const senhaInput = document.getElementById("senha");
  const entrarBtn = document.getElementById("entrar");
  const tela = document.getElementById("tela");
  const entrada = document.getElementById("entrada");
  const msg = document.getElementById("msg");
  const enviar = document.getElementById("enviar");
  const efeito = document.getElementById("efeito");
  const aplicar = document.getElementById("aplicar");
  const logBox = document.getElementById("log");

  let tipoUsuario = "jogador";

  entrarBtn.addEventListener("click", () => {
    const senha = senhaInput.value.trim();
    if (senha === "Ozymandias") {
      tipoUsuario = "jogador";
      login.style.display = "none";
      terminal.style.display = "block";
    } else if (senha === "Mestre") {
      tipoUsuario = "mestre";
      login.style.display = "none";
      painel.style.display = "block";
      addLog("✅ Painel do Mestre conectado.");
    } else {
      alert("Senha incorreta!");
    }
  });

  // Jogador envia mensagem
  entrada?.addEventListener("keydown", e => {
    if (e.key === "Enter" && entrada.value.trim()) {
      const texto = entrada.value.trim();
      socket.emit("mensagem", { tipo: "jogador", texto });
      entrada.value = "";
    }
  });

  // Mestre envia mensagem
  enviar?.addEventListener("click", () => {
    const texto = msg.value.trim();
    if (texto) {
      socket.emit("mensagem", { tipo: "mestre", texto });
      addLog(`???: ${texto}`);
      msg.value = "";
    }
  });

  // Mestre aplica efeito
  aplicar?.addEventListener("click", () => {
    const effect = efeito.value;
    socket.emit("efeito", effect);
    addLog(`Efeito aplicado: ${effect}`);
  });

  // Receber mensagens (para todos os tipos)
  socket.on("mensagem", ({ tipo, texto }) => {
    const prefix = tipo === "mestre" ? "???" : "Usuário";

    // Jogador: mostra na tela do terminal
    if (terminal.style.display === "block") {
      tela.innerHTML += `\n${prefix}: ${texto}`;
      tela.scrollTop = tela.scrollHeight;
    }

    // Mestre: mostra no painel de logs
    if (painel.style.display === "block") {
      addLog(`${prefix}: ${texto}`);
    }
  });

  // Efeitos simples
  socket.on("efeito", effect => {
    if (effect === "alerta") {
      document.body.style.backgroundColor = "#400000";
      setTimeout(() => document.body.style.backgroundColor = "black", 2000);
    } else if (effect === "limpar") {
      if (tela) tela.innerHTML = "";
    }
  });

  function addLog(text) {
    const div = document.createElement("div");
    div.textContent = text;
    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
  }
</script>
</body>
</html>
